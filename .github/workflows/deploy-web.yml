name: Deploy Nuvio Web

# Builds the NuvioWeb fork (branch video-call) with the secrets stored in this
# repo and publishes it to the nuvio-web Cloudflare Worker.
# Runs when this file changes, or manually.

on:
  workflow_dispatch:
  push:
    branches: [video-chat]
    paths:
      - .github/workflows/deploy-web.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ameennsh0-rgb/ameennsh0-rgb-NuvioWeb
          ref: video-call
          path: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write local.properties from the stored secret
        working-directory: web
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            echo "$LOCAL_PROPERTIES_BASE64" | base64 -d > local.properties
          else
            echo "No stored properties; build will use the example file"
          fi
      - name: Build
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          grep -c 11471 dist/app.bundle.js || true
      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
