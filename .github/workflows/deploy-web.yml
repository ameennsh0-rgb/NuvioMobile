name: Deploy Nuvio Web

# Builds the Nuvio web fork and deploys it to Cloudflare, reusing THIS repo's
# secrets (so no secrets need re-entering on the web fork).
# Live at: https://nuvio-web.<your-subdomain>.workers.dev

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of the web fork to deploy"
        required: false
        default: video-call

permissions:
  contents: read

concurrency:
  group: deploy-nuvio-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout web app
        uses: actions/checkout@v6
        with:
          repository: ameennsh0-rgb/ameennsh0-rgb-NuvioWeb
          ref: ${{ inputs.ref || 'video-call' }}
          path: web

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Write app config
        working-directory: web
        env:
          LP: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LP" ]; then
            printf '%s' "$LP" | base64 -d > local.properties
            echo "Wrote local.properties from secret."
          else
            echo "::warning::NUVIO_LOCAL_PROPERTIES_BASE64 not set; catalog and watch party may be limited."
          fi

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare secrets missing on this repo."
            exit 1
          fi
          for attempt in 1 2 3; do
            npx --yes wrangler@4 deploy 2>&1 | tee deploy.log && break
            sleep 30
          done
          url=$(grep -oE 'https://nuvio-web\.[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Live: $url"
          echo "### Live Nuvio Web: $url" >> "$GITHUB_STEP_SUMMARY"
