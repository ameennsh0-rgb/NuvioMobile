name: Build Video Call APK

# Deploys the nuvio-call Cloudflare Worker (video call server) and builds an
# installable APK of Nuvio Mobile with the watch party video call bubble.
# Runs on every push to the video-chat branch, or manually from the Actions tab.
#
# Repository secrets used:
#   NUVIO_LOCAL_PROPERTIES_BASE64  account sync config (same as before)
#   CF_REALTIME_APP_ID             Cloudflare Realtime SFU App ID
#   CF_REALTIME_APP_SECRET         Cloudflare Realtime SFU App Secret
#   CLOUDFLARE_API_TOKEN           API token allowed to edit Workers (to deploy the call server)
#   CLOUDFLARE_ACCOUNT_ID          your Cloudflare account ID
#   CALL_SERVER_URL                optional: use an already-deployed call server instead

on:
  push:
    branches: [video-chat]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-call-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-server:
    name: Deploy call server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.result.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy Worker
        id: deploy
        working-directory: call-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_REALTIME_APP_ID: ${{ secrets.CF_REALTIME_APP_ID }}
          CF_REALTIME_APP_SECRET: ${{ secrets.CF_REALTIME_APP_SECRET }}
          MANUAL_URL: ${{ secrets.CALL_SERVER_URL }}
        run: |
          if [ -n "$MANUAL_URL" ]; then
            echo "Using CALL_SERVER_URL secret; skipping deploy."
            echo "url=${MANUAL_URL%/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing; the APK will build without video calls."
            exit 0
          fi
          if [ -z "$CF_REALTIME_APP_ID" ] || [ -z "$CF_REALTIME_APP_SECRET" ]; then
            echo "::warning::CF_REALTIME_APP_ID / CF_REALTIME_APP_SECRET secrets missing; the APK will build without video calls."
            exit 0
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          printf '%s' "$CF_REALTIME_APP_ID" | npx --yes wrangler@4 secret put CF_REALTIME_APP_ID
          printf '%s' "$CF_REALTIME_APP_SECRET" | npx --yes wrangler@4 secret put CF_REALTIME_APP_SECRET
          url=$(grep -oE 'https://nuvio-call\.[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but couldn't find the workers.dev URL. Open Workers & Pages in the Cloudflare dashboard once to claim a workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check call server
        id: result
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then
            # A brand-new workers.dev address can take a minute to come online.
            for i in $(seq 1 18); do
              curl -fsS "$URL/" && echo && exit 0
              sleep 10
            done
            echo "::error::Call server at $URL is not responding."
            exit 1
          fi

  build:
    name: Build fullDebug APK (arm64)
    needs: call-server
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          CALL_URL: ${{ needs.call-server.outputs.url || secrets.CALL_SERVER_URL }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE|NUVIO_CALL_URL)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi
          if [ -n "$CALL_URL" ]; then
            printf '\nNUVIO_CALL_URL=%s\n' "$CALL_URL" >> local.properties
            echo "Video calls enabled: $CALL_URL"
          else
            echo "::warning::No call server URL; this APK won't show the video call bubble."
          fi

      - name: Check sync config is present
        run: |
          if ! grep -Eq '^NUVIO_SUPABASE_URL=.+' local.properties || ! grep -Eq '^NUVIO_SUPABASE_ANON_KEY=.+' local.properties; then
            echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 secret is missing or incomplete; account sync and watch parties would not work."
            exit 1
          fi
          echo "Sync config present."

      - name: Use download mirrors (avoid GitHub-hosted downloads)
        run: |
          # Gradle itself: Tencent mirror, verified against Gradle's official checksum.
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties || \
            echo 'distributionSha256Sum=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb' >> gradle/wrapper/gradle-wrapper.properties
          mkdir -p ~/.gradle/init.d
          cp .github/ci-mirrors.init.gradle.kts ~/.gradle/init.d/
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Use a fixed debug signing key
        # Same key as the earlier fork builds, so this installs as an update.
        run: |
          mkdir -p ~/.android
          cp .github/nuvio-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        # Retries: GitHub's download servers sometimes time out (504) fetching Gradle or the Kotlin compiler.
        run: |
          for attempt in 1 2 3 4; do
            if ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.android.abi=arm64-v8a --stacktrace; then
              exit 0
            fi
            echo "::warning::Build attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-video-call-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the video-call-latest release
        # Gives a direct APK download link that stays the same for every build:
        # https://github.com/${{ github.repository }}/releases/download/video-call-latest/nuvio-video-call.apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/full/debug/*.apk nuvio-video-call.apk
          if ! gh release view video-call-latest >/dev/null 2>&1; then
            gh release create video-call-latest \
              --title "Nuvio with video calls (latest)" \
              --notes "Latest Nuvio build with the watch party video call bubble. Install nuvio-video-call.apk. Updated automatically on every build of the video-chat branch." \
              --prerelease --target "$GITHUB_SHA"
          fi
          for attempt in 1 2 3; do
            gh release upload video-call-latest nuvio-video-call.apk --clobber && break
            sleep 30
          done
          echo "Direct download: https://github.com/$GITHUB_REPOSITORY/releases/download/video-call-latest/nuvio-video-call.apk"

      - name: Set up Node (for Cloudflare upload)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish to Cloudflare (fast direct download)
        # GitHub's download servers are slow/unreliable from some networks, so the APK
        # is also served from Cloudflare: https://nuvio-apk.<your-subdomain>.workers.dev
        working-directory: apk-host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets missing; skipping Cloudflare upload."
            exit 0
          fi
          ./split.sh ../nuvio-video-call.apk
          for attempt in 1 2 3; do
            npx --yes wrangler@4 deploy 2>&1 | tee deploy.log && break
            sleep 30
          done
          url=$(grep -oE 'https://nuvio-apk\.[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Direct download: $url/nuvio-video-call.apk"
          echo "### Download: $url/nuvio-video-call.apk" >> "$GITHUB_STEP_SUMMARY"
