name: Build Seekr APK

# Builds an installable debug APK of Nuvio Mobile with Seekr seek previews.
# Runs on every push to the seekr-previews branch, or manually from the Actions tab.

on:
  push:
    branches: [seekr-previews, seekr-local-fallback]
  workflow_dispatch:

permissions:
  contents: write  # publish the APK to the rolling seekr-latest release

concurrency:
  group: seekr-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare local.properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Check sync config is present
        run: |
          if ! grep -Eq '^NUVIO_SUPABASE_URL=.+' local.properties || ! grep -Eq '^NUVIO_SUPABASE_ANON_KEY=.+' local.properties; then
            echo "::error::NUVIO_LOCAL_PROPERTIES_BASE64 secret is missing or incomplete; account sync would not work."
            exit 1
          fi
          echo "Sync config present."

      - name: Use a fixed debug signing key
        # Without this every CI run signs with a new random key, and Android
        # refuses to install an update over the previous build.
        run: |
          mkdir -p ~/.android
          cp .github/seekr-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-${{ github.ref_name }}-debug-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish an encrypted copy (for automated testing on the owner's device)
        # The APK embeds private build settings, so only an encrypted copy is published.
        # It can only be decrypted with the private key that matches .github/seekr-test-pubkey.pem.
        if: github.ref_name == 'seekr-local-fallback' && hashFiles('.github/seekr-test-pubkey.pem') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls androidApp/build/outputs/apk/full/debug/*.apk | head -1)
          umask 077
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$APK" -out nuvio-seekr.apk.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/seekr-test-pubkey.pem \
            -pkeyopt rsa_padding_mode:oaep -in k.txt -out nuvio-seekr.key.enc
          rm -f k.txt
          BUILD=$(grep -o 'Build: seekr-[0-9]*[^"·]*' composeApp/src/commonMain/kotlin/com/nuvio/app/features/settings/SeekrSettingsSection.kt | head -1)
          NOTES="Encrypted test build for automated installs. $BUILD, commit ${GITHUB_SHA::7}"
          if gh release view seekr-latest >/dev/null 2>&1; then
            gh release upload seekr-latest nuvio-seekr.apk.enc nuvio-seekr.key.enc --clobber
            gh release edit seekr-latest --notes "$NOTES"
          else
            gh release create seekr-latest nuvio-seekr.apk.enc nuvio-seekr.key.enc \
              --title "Seekr test build (encrypted)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi

  emulator-test:
    name: Emulator smoke test (no streaming)
    needs: build
    if: github.ref_name == 'seekr-local-fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (test scripts + public key)
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github

      - name: Download the APK from the build job
        uses: actions/download-artifact@v7
        with:
          name: nuvio-${{ github.ref_name }}-debug-apk
          path: apk

      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cp apk/*.apk app.apk

      - name: Prepare test settings (private file, removed after the run)
        env:
          THUMBS_REPO: ${{ vars.THUMBS_REPO || 'ameennsh0-rgb/nuvio-thumbs' }}
          THUMBS_TOKEN: ${{ secrets.THUMBS_TOKEN }}
          NUVIO_EMAIL: ${{ secrets.NUVIO_EMAIL }}
          NUVIO_PASSWORD: ${{ secrets.NUVIO_PASSWORD }}
          NUVIO_PROFILE: ${{ vars.NUVIO_PROFILE }}
        run: |
          umask 077
          python3 -c 'import json, os; keys = ["THUMBS_REPO", "THUMBS_TOKEN", "NUVIO_EMAIL", "NUVIO_PASSWORD", "NUVIO_PROFILE"]; json.dump({k: os.environ.get(k, "") for k in keys}, open(".test-env.json", "w")); print({k: bool(os.environ.get(k)) for k in keys})'

      - name: Run the test on an Android 13 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 6144M
          heap-size: 576M
          disk-size: 6000M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: python3 .github/scripts/emulator_test.py

      - name: Remove test settings
        if: always()
        run: rm -f .test-env.json

      - name: Publish encrypted results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d out ] || mkdir out
          tar -czf results.tgz out
          umask 077
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in results.tgz -out seekr-test-results.tgz.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/seekr-test-pubkey.pem \
            -pkeyopt rsa_padding_mode:oaep -in k.txt -out seekr-test-results.key.enc
          rm -f k.txt results.tgz
          gh release upload seekr-latest seekr-test-results.tgz.enc seekr-test-results.key.enc --clobber --repo "$GITHUB_REPOSITORY"
