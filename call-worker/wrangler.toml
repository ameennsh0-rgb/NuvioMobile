name = "nuvio-call"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CallRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "CallDirectory"

[[durable_objects.bindings]]
name = "WATCHSYNC"
class_name = "WatchSync"

# 48-hour call archive (the bucket has a 2-day lifecycle expiration rule).
[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "nuvio-recordings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallDirectory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WatchSync"]
