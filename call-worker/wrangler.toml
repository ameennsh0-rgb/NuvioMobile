name = "nuvio-call"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CallRoom"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "CallDirectory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CallDirectory"]
